[package]
name = "gitako"
version = "0.1.0"
description = "A GitKraken-like Git desktop client"
edition = "2021"

[lib]
name = "gitako_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros"] }

# Lints: start with the correctness/idiom lints that catch real bugs (Chapter 2).
# Add more over time as the codebase earns them; don't dump the pedantic set
# on the project up front — see Chapter 1, "extraction has a cost, and a wrong
# abstraction is harder to remove than a little duplication".
[lints.clippy]
# Chapter 1.1: prefer borrowing (`&Path`, `&str`) over owning wrappers in fn params.
ptr_arg = "warn"
# Idioms that catch gratuitous clones.
redundant_clone = "warn"
cloned_instead_of_copied = "warn"
